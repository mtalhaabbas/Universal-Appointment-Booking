version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: booking_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-booking_engine_db}
      POSTGRES_USER: ${DB_USER:-booking_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-booking_secure_password_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-booking_user} -d ${DB_NAME:-booking_engine_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: booking_web
    restart: unless-stopped
    command: >
      sh -c "python backend/manage.py migrate &&
             python backend/manage.py seed_demo_data &&
             python backend/manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DB_ENGINE=postgresql
      - DB_NAME=${DB_NAME:-booking_engine_db}
      - DB_USER=${DB_USER:-booking_user}
      - DB_PASSWORD=${DB_PASSWORD:-booking_secure_password_2026}
      - DB_HOST=db
      - DB_PORT=5432
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/booking-events
      - WHATSAPP_MOCK_MODE=True
      - CALENDAR_MOCK_MODE=True
    depends_on:
      db:
        condition: service_healthy

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: booking_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data:
